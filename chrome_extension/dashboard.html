<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRAGLAB | LIVE_TELEMETRY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #060709;
      --panel-bg: #0d0f14;
      --panel-border: #1a1e28;
      --accent-red: #ff2a2a;
      --accent-red-glow: rgba(255, 42, 42, 0.4);
      --text-white: #ffffff;
      --text-dim: #5a6478;

      --status-alive: #2ecc71;      /* Bright Lime Green */
      --status-knocked: #ff2a2a;    /* Cyber Red */
      --status-eliminated: #222734; /* Dark Slate */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-black);
      color: var(--text-white);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 42, 42, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(255, 42, 42, 0.04) 0%, transparent 45%);
    }

    .dashboard-container {
      width: 100%;
      max-width: 460px; /* Cyber Leaderboard Width */
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Cyber Top Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-top: 3px solid var(--accent-red);
      border-radius: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .brand-group { display: flex; align-items: center; gap: 10px; }
    .live-dot {
      width: 10px; height: 10px;
      background: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-red);
      animation: blink 1.2s infinite alternate;
    }

    @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .brand-title span { color: var(--accent-red); margin: 0 4px; }

    .system-status {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    /* Table HUD Container */
    .hud-table-wrapper {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .hud-table {
      width: 100%;
      border-collapse: collapse;
    }

    /* Table Header */
    .hud-table th {
      background: rgba(255, 42, 42, 0.08);
      color: var(--accent-red);
      border-bottom: 1px solid var(--panel-border);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 1px;
      padding: 10px 12px;
    }

    .hud-table th.left-align { text-align: left; }
    .hud-table th.center-align { text-align: center; }
    .hud-table th.right-align { text-align: right; }

    /* Team Row */
    .hud-row {
      border-bottom: 1px solid var(--panel-border);
      transition: background 0.2s ease;
    }

    .hud-row:hover {
      background: rgba(255, 42, 42, 0.04);
    }

    .hud-row td {
      padding: 10px 12px;
      vertical-align: middle;
    }

    .rank-cell {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 14px;
      color: var(--text-dim);
      width: 32px;
    }

    .rank-1 { color: #ffffff; text-shadow: 0 0 8px var(--accent-red-glow); }

    .team-badge-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team-icon-box {
      width: 24px;
      height: 24px;
      background: rgba(255, 42, 42, 0.1);
      border: 1px solid rgba(255, 42, 42, 0.3);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: var(--accent-red);
    }

    .team-tag-text {
      font-weight: 800;
      font-size: 15px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* Status Bars (Pills) */
    .status-bars-flex {
      display: flex;
      gap: 4px;
      justify-content: center;
      align-items: center;
    }

    .status-pill {
      width: 10px;
      height: 14px;
      border-radius: 2px;
      background: var(--status-alive);
      box-shadow: 0 0 6px rgba(46, 204, 113, 0.4);
    }

    .status-pill.knocked {
      background: var(--status-knocked);
      box-shadow: 0 0 10px var(--accent-red);
      animation: pulse-red 0.8s infinite alternate;
    }

    .status-pill.eliminated {
      background: var(--status-eliminated);
      box-shadow: none;
      opacity: 0.3;
    }

    @keyframes pulse-red {
      from { opacity: 0.4; } to { opacity: 1; }
    }

    .num-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 15px;
      color: #ffffff;
      text-align: right;
    }

    .num-val.pts {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
    }

    /* Bottom Control Bar */
    .control-bar {
      display: flex;
      gap: 10px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 12px;
      border-radius: 6px;
    }

    .ctrl-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: #ffffff;
      padding: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Cyber Header -->
    <header>
      <div class="brand-group">
        <div class="live-dot"></div>
        <div>
          <div class="brand-title">FRAGLAB <span>|</span> LIVE_TELEMETRY</div>
          <div class="system-status">OP-SESSION-6800 // SORT: MATCH_SCORE</div>
        </div>
      </div>
      <button class="ctrl-btn" style="flex: none; padding: 6px 12px;" onclick="exportData()">📥 EXPORT</button>
    </header>

    <!-- Leaderboard Table HUD (Image 2 Layout + Image 1 Cyber-Red Aesthetic) -->
    <div class="hud-table-wrapper">
      <table class="hud-table">
        <thead>
          <tr>
            <th class="left-align" style="width: 32px;">#</th>
            <th class="left-align">TEAMS</th>
            <th class="center-align">STATUS</th>
            <th class="right-align">FIN</th>
            <th class="right-align">PTS</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Live Polled Data -->
        </tbody>
      </table>
    </div>

    <!-- Control Bar -->
    <div class="control-bar">
      <button class="ctrl-btn" onclick="loadDefaultRoster()">LOAD SCARFALL ROSTER</button>
      <button class="ctrl-btn" onclick="switchRuleset('bmps')">RULESET: BMPS</button>
    </div>

  </div>

  <script>
    const SERVER_URL = "http://127.0.0.1:5000";

    async function pollTelemetryState() {
      try {
        const res = await fetch(`${SERVER_URL}/api/telemetry_state`);
        const data = await res.json();
        if (data.status === "success") {
          renderLeaderboard(data.leaderboard);
        }
      } catch (err) {
        console.warn("Polling error:", err);
      }
    }

    function renderLeaderboard(leaderboard) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (!leaderboard || leaderboard.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--text-dim);">No active roster loaded. Click 'LOAD SCARFALL ROSTER'.</td></tr>`;
        return;
      }

      leaderboard.forEach(item => {
        const row = document.createElement('tr');
        row.className = 'hud-row';

        const rankFormatted = String(item.current_rank).padStart(2, '0');

        let barsHtml = '';
        item.player_states.forEach(pState => {
          let sClass = '';
          if (pState === 'KNOCKED') sClass = 'knocked';
          else if (pState === 'ELIMINATED') sClass = 'eliminated';
          barsHtml += `<div class="status-pill ${sClass}" title="${pState}"></div>`;
        });

        row.innerHTML = `
          <td class="rank-cell ${item.current_rank === 1 ? 'rank-1' : ''}">${rankFormatted}</td>
          <td>
            <div class="team-badge-box">
              <div class="team-icon-box">${item.team_tag.substring(0, 2)}</div>
              <span class="team-tag-text">${item.team_tag}</span>
            </div>
          </td>
          <td style="text-align: center;">
            <div class="status-bars-flex">${barsHtml}</div>
          </td>
          <td class="num-val">${item.finishes}</td>
          <td class="num-val pts">${item.total_points}</td>
        `;

        tbody.appendChild(row);
      });
    }

    async function loadDefaultRoster() {
      const rosterPayload = {
        teams: [
          { tag: 'PLTN',   name: 'Peloton',         players: ['P1', 'P2', 'P3', 'P4'] },
          { tag: 'CPTN',   name: 'Captains',        players: ['C1', 'C2', 'C3', 'C4'] },
          { tag: 'SC',     name: 'Shadow Clan',     players: ['S1', 'S2', 'S3', 'S4'] },
          { tag: 'OCN',    name: 'Ocean Esports',   players: ['O1', 'O2', 'O3', 'O4'] },
          { tag: '6SENSE', name: 'Sixth Sense',     players: ['61', '62', '63', '64'] },
          { tag: 'STAR',   name: 'Star Alliance',   players: ['St1', 'St2', 'St3', 'St4'] },
          { tag: 'RS',     name: 'Rising Stars',    players: ['R1', 'R2', 'R3', 'R4'] },
          { tag: 'XBUG',   name: 'X-Bugs',          players: ['X1', 'X2', 'X3', 'X4'] },
          { tag: 'KyZN',   name: 'KyZN Esports',    players: ['EviLKiOz', 'Shadow', 'Viper', 'Apex'] },
          { tag: 'FLCN',   name: 'Falcon Squad',    players: ['PRADIP', 'Hawk', 'Falcon1', 'Blaze'] },
          { tag: 'TxL',    name: 'TxL Clan',        players: ['CLUSTER', 'Striker', 'Ghost', 'Raven'] },
          { tag: 'Tr',     name: 'Team Tr',          players: ['CHAMP-08', 'Nitro', 'Venom', 'Storm'] }
        ]
      };

      try {
        await fetch(`${SERVER_URL}/api/roster`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(rosterPayload)
        });
        pollTelemetryState();
      } catch (err) {
        alert("Error loading roster: " + err);
      }
    }

    async function switchRuleset(rulesetName) {
      try {
        await fetch(`${SERVER_URL}/api/ruleset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ruleset: rulesetName })
        });
        pollTelemetryState();
      } catch (err) {
        alert("Error updating ruleset: " + err);
      }
    }

    function exportData() {
      window.open(`${SERVER_URL}/api/telemetry_state`, '_blank');
    }

    // Auto Poll
    setInterval(pollTelemetryState, 1000);
    pollTelemetryState();
  </script>
</body>
</html>
