<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FragEngine V0.16 // Decoupled Match Intelligence HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0e14;
      --panel-bg: rgba(18, 24, 38, 0.75);
      --panel-border: rgba(191, 161, 95, 0.25);
      --accent-copper: #d35400;
      --accent-gold: #bfa15f;
      --text-main: #f0f3f8;
      --text-dim: #8b95a5;

      --status-alive: #2ecc71;
      --status-knocked: #e74c3c;
      --status-eliminated: #34495e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(211, 84, 0, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(191, 161, 95, 0.06) 0%, transparent 45%);
    }

    .dashboard-container {
      width: 100%;
      max-width: 1240px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent-copper), var(--accent-gold));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; color: #000;
    }

    .brand-text h1 {
      font-size: 20px; font-weight: 800; letter-spacing: 1px;
      background: linear-gradient(90deg, #fff, var(--accent-gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .brand-text p { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

    .match-meta { display: flex; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
    .meta-box { background: rgba(0, 0, 0, 0.3); padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .meta-box span { color: var(--accent-gold); font-weight: 700; }

    .table-card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 14px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--accent-gold); margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .leaderboard-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
    .leaderboard-table th {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--text-dim); text-transform: uppercase; padding: 8px 12px; text-align: left;
    }
    .leaderboard-table th.center { text-align: center; }
    .leaderboard-table th.right { text-align: right; }

    .team-row { background: rgba(255, 255, 255, 0.02); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .team-row:hover { background: rgba(191, 161, 95, 0.08); transform: translateX(4px); }
    .team-row td { padding: 10px 12px; vertical-align: middle; }
    .team-row td:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
    .team-row td:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }

    .rank-cell { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; color: var(--text-dim); width: 36px; }
    .rank-1 { color: #f1c40f; } .rank-2 { color: #bdc3c7; } .rank-3 { color: #e67e22; }

    .team-info { display: flex; align-items: center; gap: 12px; }
    .team-badge {
      width: 32px; height: 28px; border-radius: 6px; background: rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 11px; font-family: 'JetBrains Mono', monospace;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .team-name { font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }

    .status-bars { display: flex; gap: 4px; justify-content: center; }
    .status-bar {
      width: 14px; height: 18px; border-radius: 3px; background: var(--status-alive);
      transition: all 0.4s ease; box-shadow: 0 0 8px rgba(46, 204, 113, 0.3);
    }
    .status-bar.knocked {
      background: var(--status-knocked); box-shadow: 0 0 12px rgba(231, 76, 60, 0.8);
      animation: pulse-red 1s infinite alternate;
    }
    .status-bar.eliminated { background: var(--status-eliminated); box-shadow: none; opacity: 0.4; }

    @keyframes pulse-red {
      0% { transform: scale(1); } 100% { transform: scale(1.1); }
    }

    .pts-cell { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 15px; color: #fff; text-align: right; }

    .control-panel { display: flex; flex-direction: column; gap: 20px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }

    .control-btn {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--panel-border);
      color: var(--text-main); padding: 12px 16px; border-radius: 8px;
      font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      transition: all 0.2s ease;
    }
    .control-btn:hover {
      background: var(--accent-copper); border-color: var(--accent-copper);
      transform: translateY(-2px); box-shadow: 0 4px 16px rgba(211, 84, 0, 0.4);
    }

    select, textarea {
      width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--panel-border);
      color: #fff; padding: 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <header>
      <div class="brand">
        <div class="brand-logo">F</div>
        <div class="brand-text">
          <h1>FRAGENGINE TELEMETRY</h1>
          <p>V0.16 // DECOUPLED MATCH INTELLIGENCE HUD</p>
        </div>
      </div>
      <div class="match-meta">
        <div class="meta-box">RULESET: <span id="lblRuleset">BMPS</span></div>
        <div class="meta-box">TEAMS ALIVE: <span id="lblTeamsAlive">-</span></div>
      </div>
    </header>

    <!-- Main Leaderboard Table -->
    <div class="table-card">
      <div class="card-title">
        <span>Live Standings</span>
        <span style="font-size: 11px; color: var(--text-dim);">REAL-TIME AUTOMATED LOOKUP MATRIX</span>
      </div>

      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Team</th>
            <th class="center">Status (4-Bar)</th>
            <th class="right">KP</th>
            <th class="right">PP</th>
            <th class="right">PTS</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Live Polled Data -->
        </tbody>
      </table>
    </div>

    <!-- Side Controls & Roster Pre-Setup -->
    <div class="control-panel">
      
      <div class="table-card">
        <div class="card-title">Select Tournament Ruleset</div>
        <select id="selRuleset" onchange="changeRuleset(this.value)">
          <option value="bmps">BMPS / Standard Official Matrix (1st = 10pt)</option>
          <option value="hardcore">Hardcore Matrix (Kills = 2pt)</option>
        </select>
      </div>

      <div class="table-card">
        <div class="card-title">Pre-Match Roster Setup</div>
        <button class="control-btn" onclick="loadDefaultScarfallRoster()">
          <span>Load Scarfall Baseline Roster</span>
          <span>LOAD</span>
        </button>
      </div>

    </div>

  </div>

  <script>
    const SERVER_URL = "http://127.0.0.1:5000";

    async function pollTelemetryState() {
      try {
        const res = await fetch(`${SERVER_URL}/api/telemetry_state`);
        const data = await res.json();
        if (data.status === "success") {
          document.getElementById('lblRuleset').innerText = data.active_ruleset;
          document.getElementById('lblTeamsAlive').innerText = data.teams_alive;
          renderLeaderboard(data.leaderboard);
        }
      } catch (err) {
        console.warn("Polling error:", err);
      }
    }

    function renderLeaderboard(leaderboard) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (!leaderboard || leaderboard.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px; color: var(--text-dim);">No active roster loaded. Click 'Load Scarfall Baseline Roster' to initialize.</td></tr>`;
        return;
      }

      leaderboard.forEach(item => {
        const row = document.createElement('tr');
        row.className = 'team-row';

        let rankClass = '';
        if (item.current_rank === 1) rankClass = 'rank-1';
        else if (item.current_rank === 2) rankClass = 'rank-2';
        else if (item.current_rank === 3) rankClass = 'rank-3';

        let barsHtml = '';
        item.player_states.forEach(pState => {
          let sClass = '';
          if (pState === 'KNOCKED') sClass = 'knocked';
          else if (pState === 'ELIMINATED') sClass = 'eliminated';
          barsHtml += `<div class="status-bar ${sClass}" title="${pState}"></div>`;
        });

        row.innerHTML = `
          <td class="rank-cell ${rankClass}">#${item.current_rank}</td>
          <td>
            <div class="team-info">
              <div class="team-badge">${item.team_tag}</div>
              <div class="team-name">${item.team_name}</div>
            </div>
          </td>
          <td class="center">
            <div class="status-bars">${barsHtml}</div>
          </td>
          <td class="pts-cell">${item.kill_points}</td>
          <td class="pts-cell">${item.placement_points}</td>
          <td class="pts-cell" style="color: var(--accent-gold);">${item.total_points}</td>
        `;

        tbody.appendChild(row);
      });
    }

    async function changeRuleset(rulesetName) {
      try {
        await fetch(`${SERVER_URL}/api/ruleset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ruleset: rulesetName })
        });
        pollTelemetryState();
      } catch (err) {
        alert("Error updating ruleset: " + err);
      }
    }

    async function loadDefaultScarfallRoster() {
      const rosterPayload = {
        teams: [
          { tag: 'KyZN', name: 'KyZN Esports', players: ['EviLKiOz', 'Shadow', 'Viper', 'Apex'] },
          { tag: 'FLCN', name: 'Falcon Squad', players: ['PRADIP', 'Hawk', 'Falcon1', 'Blaze'] },
          { tag: 'TxL',  name: 'TxL Clan',      players: ['CLUSTER', 'Striker', 'Ghost', 'Raven'] },
          { tag: 'Tr',   name: 'Team Tr',        players: ['CHAMP-08', 'Nitro', 'Venom', 'Storm'] },
          { tag: 'NRL',  name: 'NRL Gaming',     players: ['GUN', 'Bullet', 'Sniper', 'Trigger'] },
          { tag: 'SRV',  name: 'SRV Alliance',   players: ['Aloneboi', 'Solo', 'Rider', 'Alpha'] }
        ]
      };

      try {
        await fetch(`${SERVER_URL}/api/roster`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(rosterPayload)
        });
        pollTelemetryState();
      } catch (err) {
        alert("Error loading roster: " + err);
      }
    }

    // Poll telemetry state every 1 second
    setInterval(pollTelemetryState, 1000);
    pollTelemetryState();
  </script>
</body>
</html>
