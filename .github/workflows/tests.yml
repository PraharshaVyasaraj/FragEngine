name: FragEngine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install CI dependencies
      run: |
        python -m pip install --upgrade pip
        # Use CI-specific requirements (excludes PaddlePaddle/PaddleOCR — not available on Linux PyPI)
        pip install -r requirements-ci.txt
    - name: Run tests
      run: |
        # test_pipeline.py auto-skips when GITHUB_ACTIONS=true
        pytest tests/
